apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-server
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-server
    spec:
      containers:
      - name: {{ .Release.Name }}-server
        image: {{ include "unikorn.computeServerImage" . }}
        args:
        - --namespace={{ .Release.Namespace }}
        {{- include "unikorn.cors.flags" . | nindent 8 }}
        {{- include "unikorn.otlp.flags" . | nindent 8 }}
        {{- include "unikorn.audit.flags" . | nindent 8 }}
        {{- include "unikorn.identity.flags" . | nindent 8 }}
        {{- include "unikorn.region.flags" . | nindent 8 }}
        {{- include "unikorn.mtls.flags" . | nindent 8 }}
        {{- with .Values.server.reservedTagPrefixes }}
        {{- $pairs := list }}
        {{- range $prefix := keys . | sortAlpha }}
        {{- $pairs = append $pairs (printf "%s=%s" $prefix (index $.Values.server.reservedTagPrefixes $prefix)) }}
        {{- end }}
        - {{ printf "--reserved-tag-prefixes=%s" (join "," $pairs) | quote }}
        {{- end }}
        {{- range $i, $arg := .Values.server.extraFlags }}
        - {{ $arg }}
        {{- end }}
        ports:
        - name: http
          containerPort: 6080
        - name: prometheus
          containerPort: 8080
        - name: pprof
          containerPort: 6060
        resources:
          {{- .Values.server.resources | toYaml | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
      serviceAccountName: {{ .Release.Name }}-server
      securityContext:
        runAsNonRoot: true
