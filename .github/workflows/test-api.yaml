name: API Tests
# Passes no expected_version, so these runs are regression, not release evidence.
on:
  schedule:
    - cron: '0 6 * * *'  # Run nightly at 6am UTC
  workflow_dispatch:
    inputs:
      run_dev:
        description: 'Run Dev tests'
        type: boolean
        default: true
      run_uat:
        description: 'Run UAT tests'
        type: boolean
        default: false
      use_dev_deployed_version:
        description: 'Use the deployed Dev version for Dev checkout'
        type: boolean
        default: true
      use_staging_constellation:
        description: 'Use the staged constellation tag for UAT checkout'
        type: boolean
        default: true
      skip_slack_notifications:
        description: 'Skip Slack notifications'
        type: boolean
        default: false
      smoke:
        description: 'Run only the curated smoke subset'
        type: boolean
        default: false
      focus:
        description: 'Test suite to run'
        required: false
        default: 'All'
        type: choice
        options:
        - 'All'
        - 'Instance Operations'
        - 'Security and Authentication'
        - 'SSH Integration'
        - 'Service Version'
      region_id_override:
        description: 'Override Region ID (if set, you must also provide flavor, image and network overrides)'
        required: false
        type: string
      flavor_id_override:
        description: 'Override Flavor ID (required when region_id_override is set)'
        required: false
        type: string
      image_id_override:
        description: 'Override Image ID (required when region_id_override is set)'
        required: false
        type: string
      network_id_override:
        description: 'Override Network ID (required when region_id_override is set)'
        required: false
        type: string

permissions:
  contents: read
  # Granted so the reusable's test jobs can request it (Teleport/Grafana).
  id-token: write

jobs:
  dev:
    name: Dev
    if: github.event_name == 'schedule' || github.event.inputs.run_dev == 'true'
    uses: ./.github/workflows/run-api-suite.yaml
    with:
      environment: dev
      focus: ${{ github.event.inputs.focus || 'All' }}
      smoke: ${{ github.event.inputs.smoke == 'true' }}
      region_id: ${{ github.event.inputs.region_id_override || '' }}
      flavor_id: ${{ github.event.inputs.flavor_id_override || '' }}
      image_id: ${{ github.event.inputs.image_id_override || '' }}
      network_id: ${{ github.event.inputs.network_id_override || '' }}
      skip_slack_notifications: ${{ github.event.inputs.skip_slack_notifications == 'true' }}
      use_deployed_version: ${{ github.event_name == 'schedule' || github.event.inputs.use_dev_deployed_version != 'false' }}
    secrets: inherit

  uat:
    name: UAT
    if: github.event_name == 'schedule' || github.event.inputs.run_uat == 'true'
    uses: ./.github/workflows/run-api-suite.yaml
    with:
      environment: uat
      focus: ${{ github.event.inputs.focus || 'All' }}
      smoke: ${{ github.event.inputs.smoke == 'true' }}
      region_id: ${{ github.event.inputs.region_id_override || '' }}
      flavor_id: ${{ github.event.inputs.flavor_id_override || '' }}
      image_id: ${{ github.event.inputs.image_id_override || '' }}
      network_id: ${{ github.event.inputs.network_id_override || '' }}
      skip_slack_notifications: ${{ github.event.inputs.skip_slack_notifications == 'true' }}
      use_deployed_version: ${{ github.event_name == 'schedule' || github.event.inputs.use_staging_constellation != 'false' }}
    secrets: inherit
