name: Run API Suite
# With `expected_version` set, no test runs unless the deployed version matches it, and the
# versions-summary artifact is uploaded on every outcome: release-evidence-dispatch.yml
# publishes from it. Callers must pass `secrets: inherit` and grant `id-token: write` (the
# test jobs need it for Teleport/Grafana).
on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment: dev or uat'
        type: string
        required: true
      expected_version:
        description: 'If set, gate the run on the deployed version matching it (release evidence)'
        type: string
        required: false
        default: ''
      focus:
        description: 'Single test area to run (ignored when smoke=true)'
        type: string
        required: false
        default: 'All'
      smoke:
        description: 'Run only the curated smoke subset'
        type: boolean
        required: false
        default: false
      region_id:
        description: 'Override TEST_REGION_ID (requires flavor_id, image_id and network_id)'
        type: string
        required: false
        default: ''
      flavor_id:
        description: 'Override TEST_FLAVOR_ID'
        type: string
        required: false
        default: ''
      image_id:
        description: 'Override TEST_IMAGE_ID'
        type: string
        required: false
        default: ''
      network_id:
        description: 'Override TEST_NETWORK_ID'
        type: string
        required: false
        default: ''
      skip_slack_notifications:
        description: 'Skip the Slack report'
        type: boolean
        required: false
        default: false
      use_deployed_version:
        description: 'Resolve the checkout ref from the deployed version API (vs the called ref)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  # Always runs (this is a call-only workflow), so resolvers can depend on it with plain
  # success() semantics: a failed guard blocks them, there is no skipped-guard case.
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
    - name: Guard environment, focus and overrides
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        FOCUS: ${{ inputs.focus }}
        REGION_ID: ${{ inputs.region_id }}
        FLAVOR_ID: ${{ inputs.flavor_id }}
        IMAGE_ID: ${{ inputs.image_id }}
        NETWORK_ID: ${{ inputs.network_id }}
      run: |
        case "$ENVIRONMENT" in
          dev|uat) ;;
          *) echo "::error::environment must be dev|uat, got '$ENVIRONMENT'"; exit 1;;
        esac
        case "${FOCUS:-All}" in
          All|'Instance Operations'|'Security and Authentication'|'SSH Integration'|'Service Version') ;;
          *) echo "::error::unknown focus '$FOCUS'"; exit 1;;
        esac
        if [ -n "$REGION_ID" ]; then
          missing=()
          [ -z "$FLAVOR_ID" ] && missing+=("flavor_id")
          [ -z "$IMAGE_ID" ] && missing+=("image_id")
          [ -z "$NETWORK_ID" ] && missing+=("network_id")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::region_id is set but these overrides are missing: ${missing[*]}"; exit 1
          fi
        fi

  find-dev-deployed-version:
    name: Resolve Dev test ref
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    if: inputs.environment == 'dev'
    outputs:
      ref: ${{ steps.find.outputs.ref }}
      version: ${{ steps.find.outputs.version }}
    steps:
    - name: Resolve Dev checkout ref
      uses: nscaledev/quality-tooling/.github/actions/uni-find-staging-constellation@main
      id: find
      with:
        service: uni-compute
        # Pin to uni-compute: inside a cross-repo workflow_call, github.repository is the
        # caller's repo, so the action's service-repo default would validate the tag in the
        # wrong repository. uni-compute is public, so the default github.token can read it.
        service-repo: nscaledev/uni-compute
        releases-read-token: ${{ secrets.RELEASES_READ_TOKEN }}
        use-staging-constellation: ${{ inputs.use_deployed_version }}
        use-version-api: true
        version-api-url: ${{ vars.DEV_API_BASE_URL }}/api/version
        version-api-token: ${{ secrets.DEV_API_AUTH_TOKEN }}
        fallback-to-constellation: false
        summary-title: Dev API Test Version

    - name: Gate on expected version
      id: gate
      if: inputs.expected_version != ''
      env:
        EXPECTED: ${{ inputs.expected_version }}
        DEPLOYED: ${{ steps.find.outputs.version }}
      run: |
        norm() { printf '%s' "${1#v}"; }
        exp="$(norm "$EXPECTED")"; got="$(norm "$DEPLOYED")"
        if [ -z "$got" ]; then
          echo "::error::no deployed version resolved for the gate"; exit 1
        fi
        if [ "$exp" != "$got" ]; then
          echo "::error::version mismatch: expected '$exp' but '$got' is deployed; not running evidence tests"; exit 1
        fi
        echo "version gate passed: $got"

    - name: Write versions summary
      if: ${{ always() && inputs.expected_version != '' }}
      env:
        ENVIRONMENT_NAME: dev
        EXPECTED: ${{ inputs.expected_version }}
        DEPLOYED: ${{ steps.find.outputs.version }}
        REF: ${{ steps.find.outputs.ref }}
        FIND_OUTCOME: ${{ steps.find.outcome }}
        GATE_OUTCOME: ${{ steps.gate.outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        if [ "$FIND_OUTCOME" != "success" ] || [ -z "$DEPLOYED" ]; then
          gate_result="unresolved"
        elif [ "$GATE_OUTCOME" = "success" ]; then
          gate_result="passed"
        else
          gate_result="failed"
        fi
        jq -n \
          --arg component uni-compute \
          --arg environment "$ENVIRONMENT_NAME" \
          --arg expected "$EXPECTED" \
          --arg tested "$DEPLOYED" \
          --arg ref "$REF" \
          --arg gate "$gate_result" \
          --arg run_url "$RUN_URL" \
          --arg timestamp "$ts" \
          '{component:$component, environment:$environment, expected_version:$expected,
            tested_version:$tested, ref:$ref, gate_result:$gate, run_url:$run_url,
            timestamp:$timestamp}' > versions-summary.json

    - name: Archive versions summary
      if: ${{ always() && inputs.expected_version != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: versions-summary-dev
        path: versions-summary.json
        retention-days: 180

  API-Tests-Dev:
    name: API Tests (dev)
    needs: find-dev-deployed-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Teleport-backed Grafana lookup and OTLP collector shipping.
      id-token: write
    if: inputs.environment == 'dev' && needs.find-dev-deployed-version.outputs.ref != ''
    env:
      ENVIRONMENT: dev
      FOCUS: ${{ inputs.focus || 'All' }}
      API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
      REGION_BASE_URL: ${{ vars.DEV_REGION_BASE_URL }}
      API_AUTH_TOKEN: ${{ secrets.DEV_API_AUTH_TOKEN }}
      TEST_ORG_ID: ${{ vars.DEV_TEST_ORG_ID }}
      TEST_PROJECT_ID: ${{ vars.DEV_TEST_PROJECT_ID }}
      TEST_REGION_ID: ${{ inputs.region_id || vars.DEV_TEST_REGION_ID }}
      TEST_FLAVOR_ID: ${{ inputs.flavor_id || vars.DEV_TEST_FLAVOR_ID }}
      TEST_IMAGE_ID: ${{ inputs.image_id || vars.DEV_TEST_IMAGE_ID }}
      TEST_NETWORK_ID: ${{ inputs.network_id || vars.DEV_TEST_NETWORK_ID }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Explicit: checkout defaults to the caller's repo on a cross-repo workflow_call.
        repository: nscaledev/uni-compute
        ref: ${{ needs.find-dev-deployed-version.outputs.ref }}

    - name: Setup Go
      uses: actions/setup-go@v3
      with:
        go-version-file: go.mod
        cache: true

    - name: Touch
      run: make touch

    - name: Run API Tests (smoke)
      if: inputs.smoke == true
      run: make test-api-smoke

    - name: Run API Tests
      if: inputs.smoke != true && (inputs.focus == '' || inputs.focus == 'All')
      run: make test-api

    - name: Run API Tests with Focus
      if: inputs.smoke != true && inputs.focus != '' && inputs.focus != 'All'
      run: make test-api-focus FOCUS="$FOCUS"

    - name: Archive API Test Results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-test-results-dev
        path: test/api/suites/test-results.json
        retention-days: 180

    - name: Archive API Test JUnit Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-test-junit-dev
        path: test/api/suites/junit.xml
        retention-days: 180

    - name: Create Linear Issues for Test Failures
      uses: nscaledev/quality-tooling/.github/actions/linear-test-failures@main
      if: ${{ !cancelled() }}
      with:
        test-results-path: test/api/suites/test-results.json
        workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        linear-api-key: ${{ secrets.LINEAR_API_KEY }}
        linear-team-id: ${{ vars.LINEAR_TEAM_ID }}
        linear-project-id: ${{ vars.LINEAR_PROJECT_ID }}
        environment: dev
        linear-priority: '3'
        max-failures: '5'

    - name: Report API Test Results
      uses: nscaledev/quality-tooling/.github/actions/test-results-report@main
      if: ${{ !cancelled() }}
      with:
        test-results-path: test/api/suites/test-results.json
        format: ginkgo-json
        workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
        send-slack: ${{ inputs.skip_slack_notifications != true && 'true' || 'false' }}
        environment: dev
        deployed-version: ${{ needs.find-dev-deployed-version.outputs.version || needs.find-dev-deployed-version.outputs.ref }}
        title: 'Compute API Test Results'
        test-history-suite: uni-compute-api
        component-name: uni-compute
        component-repo: nscaledev/uni-compute
        component-ref: ${{ needs.find-dev-deployed-version.outputs.ref }}
        component-version-url: ${{ env.API_BASE_URL }}/api/version
        component-version-token: ${{ env.API_AUTH_TOKEN }}
        enable-ai-analysis: 'true'
        claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        enable-grafana-log-enrichment: 'true'
        grafana-service-account-token: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        grafana-log-lookback: 6h

  find-uat-deployed-version:
    name: Resolve UAT test ref
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    if: inputs.environment == 'uat'
    outputs:
      ref: ${{ steps.find.outputs.ref }}
      version: ${{ steps.find.outputs.version }}
    steps:
    - name: Resolve UAT checkout ref
      uses: nscaledev/quality-tooling/.github/actions/uni-find-staging-constellation@main
      id: find
      with:
        service: uni-compute
        # Pin to uni-compute: inside a cross-repo workflow_call, github.repository is the
        # caller's repo, so the action's service-repo default would validate the tag in the
        # wrong repository. uni-compute is public, so the default github.token can read it.
        service-repo: nscaledev/uni-compute
        releases-read-token: ${{ secrets.RELEASES_READ_TOKEN }}
        use-staging-constellation: ${{ inputs.use_deployed_version }}
        use-version-api: true
        version-api-url: ${{ vars.UAT_API_BASE_URL }}/api/version
        version-api-token: ${{ secrets.UAT_API_AUTH_TOKEN }}
        fallback-to-constellation: false
        summary-title: UAT API Test Version

    - name: Gate on expected version
      id: gate
      if: inputs.expected_version != ''
      env:
        EXPECTED: ${{ inputs.expected_version }}
        DEPLOYED: ${{ steps.find.outputs.version }}
      run: |
        norm() { printf '%s' "${1#v}"; }
        exp="$(norm "$EXPECTED")"; got="$(norm "$DEPLOYED")"
        if [ -z "$got" ]; then
          echo "::error::no deployed version resolved for the gate"; exit 1
        fi
        if [ "$exp" != "$got" ]; then
          echo "::error::version mismatch: expected '$exp' but '$got' is deployed; not running evidence tests"; exit 1
        fi
        echo "version gate passed: $got"

    - name: Write versions summary
      if: ${{ always() && inputs.expected_version != '' }}
      env:
        ENVIRONMENT_NAME: uat
        EXPECTED: ${{ inputs.expected_version }}
        DEPLOYED: ${{ steps.find.outputs.version }}
        REF: ${{ steps.find.outputs.ref }}
        FIND_OUTCOME: ${{ steps.find.outcome }}
        GATE_OUTCOME: ${{ steps.gate.outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        if [ "$FIND_OUTCOME" != "success" ] || [ -z "$DEPLOYED" ]; then
          gate_result="unresolved"
        elif [ "$GATE_OUTCOME" = "success" ]; then
          gate_result="passed"
        else
          gate_result="failed"
        fi
        jq -n \
          --arg component uni-compute \
          --arg environment "$ENVIRONMENT_NAME" \
          --arg expected "$EXPECTED" \
          --arg tested "$DEPLOYED" \
          --arg ref "$REF" \
          --arg gate "$gate_result" \
          --arg run_url "$RUN_URL" \
          --arg timestamp "$ts" \
          '{component:$component, environment:$environment, expected_version:$expected,
            tested_version:$tested, ref:$ref, gate_result:$gate, run_url:$run_url,
            timestamp:$timestamp}' > versions-summary.json

    - name: Archive versions summary
      if: ${{ always() && inputs.expected_version != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: versions-summary-uat
        path: versions-summary.json
        retention-days: 180

  API-Tests-UAT:
    name: API Tests (uat)
    needs: find-uat-deployed-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Teleport-backed Grafana lookup and OTLP collector shipping.
      id-token: write
    if: inputs.environment == 'uat' && needs.find-uat-deployed-version.outputs.ref != ''
    env:
      ENVIRONMENT: uat
      FOCUS: ${{ inputs.focus || 'All' }}
      API_BASE_URL: ${{ vars.UAT_API_BASE_URL }}
      REGION_BASE_URL: ${{ vars.UAT_REGION_BASE_URL }}
      API_AUTH_TOKEN: ${{ secrets.UAT_API_AUTH_TOKEN }}
      TEST_ORG_ID: ${{ vars.UAT_TEST_ORG_ID }}
      TEST_PROJECT_ID: ${{ vars.UAT_TEST_PROJECT_ID }}
      TEST_REGION_ID: ${{ inputs.region_id || vars.UAT_TEST_REGION_ID }}
      TEST_FLAVOR_ID: ${{ inputs.flavor_id || vars.UAT_TEST_FLAVOR_ID }}
      TEST_IMAGE_ID: ${{ inputs.image_id || vars.UAT_TEST_IMAGE_ID }}
      TEST_NETWORK_ID: ${{ inputs.network_id || vars.UAT_TEST_NETWORK_ID }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Explicit: checkout defaults to the caller's repo on a cross-repo workflow_call.
        repository: nscaledev/uni-compute
        ref: ${{ needs.find-uat-deployed-version.outputs.ref }}

    - name: Setup Go
      uses: actions/setup-go@v3
      with:
        go-version-file: go.mod
        cache: true

    - name: Touch
      run: make touch

    - name: Run API Tests (smoke)
      if: inputs.smoke == true
      run: make test-api-smoke

    - name: Run API Tests
      if: inputs.smoke != true && (inputs.focus == '' || inputs.focus == 'All')
      run: make test-api

    - name: Run API Tests with Focus
      if: inputs.smoke != true && inputs.focus != '' && inputs.focus != 'All'
      run: make test-api-focus FOCUS="$FOCUS"

    - name: Archive API Test Results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-test-results-uat
        path: test/api/suites/test-results.json
        retention-days: 180

    - name: Archive API Test JUnit Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-test-junit-uat
        path: test/api/suites/junit.xml
        retention-days: 180

    - name: Create Linear Issues for Test Failures
      uses: nscaledev/quality-tooling/.github/actions/linear-test-failures@main
      if: ${{ !cancelled() }}
      with:
        test-results-path: test/api/suites/test-results.json
        workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        linear-api-key: ${{ secrets.LINEAR_API_KEY }}
        linear-team-id: ${{ vars.LINEAR_TEAM_ID }}
        linear-project-id: ${{ vars.LINEAR_PROJECT_ID }}
        environment: uat
        linear-priority: '3'
        max-failures: '5'

    - name: Report API Test Results
      uses: nscaledev/quality-tooling/.github/actions/test-results-report@main
      if: ${{ !cancelled() }}
      with:
        test-results-path: test/api/suites/test-results.json
        format: ginkgo-json
        workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
        send-slack: ${{ inputs.skip_slack_notifications != true && 'true' || 'false' }}
        environment: uat
        deployed-version: ${{ needs.find-uat-deployed-version.outputs.version || needs.find-uat-deployed-version.outputs.ref }}
        title: 'Compute API Test Results'
        test-history-suite: uni-compute-api
        component-name: uni-compute
        component-repo: nscaledev/uni-compute
        component-ref: ${{ needs.find-uat-deployed-version.outputs.ref }}
        component-version-url: ${{ env.API_BASE_URL }}/api/version
        component-version-token: ${{ env.API_AUTH_TOKEN }}
        enable-ai-analysis: 'true'
        claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        enable-grafana-log-enrichment: 'true'
        grafana-service-account-token: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        grafana-log-lookback: 6h

  # Alerts when the requested environment's tests did not run (e.g. an expired version-api
  # token skips the test job, so nothing else posts to Slack).
  notify-skipped-api-tests:
    name: Notify skipped API tests
    needs:
    - find-dev-deployed-version
    - API-Tests-Dev
    - find-uat-deployed-version
    - API-Tests-UAT
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && inputs.skip_slack_notifications != true }}
    steps:
    - name: Notify Slack that Dev API tests did not run
      if: inputs.environment == 'dev' && needs.API-Tests-Dev.result == 'skipped'
      uses: slackapi/slack-github-action@v2
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": ":red_circle: *Compute API Tests (dev) did not run* — `${{ github.repository }}`. Resolve Dev test ref finished with `${{ needs.find-dev-deployed-version.result }}` — see the run for the cause.\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

    - name: Notify Slack that UAT API tests did not run
      if: inputs.environment == 'uat' && needs.API-Tests-UAT.result == 'skipped'
      uses: slackapi/slack-github-action@v2
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": ":red_circle: *Compute API Tests (uat) did not run* — `${{ github.repository }}`. Resolve UAT test ref finished with `${{ needs.find-uat-deployed-version.result }}` — see the run for the cause.\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
